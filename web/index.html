<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>desmos-music player</title>
  <!-- Desmos API demo key: fine for local testing only. Get your own key for anything public: https://www.desmos.com/my-api -->
  <script src="https://www.desmos.com/api/v1.11/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #1d1a16; color: #f5e6c8; font-family: system-ui, sans-serif; }
    header { padding: 8px 12px; display: flex; gap: 12px; align-items: center; }
    select, button { font: inherit; }
    #calc { position: absolute; top: 48px; bottom: 0; left: 0; right: 0; }
  </style>
</head>
<body>
  <header>
    <strong>desmos-music</strong>
    <select id="song"></select>
    <button id="load">Load</button>
    <button id="play">▶ Play</button>
    <button id="restart">⏮ Restart</button>
    <span>Run <code>python -m desmos_music serve</code>, pick a song, press ▶ on the ticker.</span>
  </header>
  <div id="calc"></div>
  <script>
    const calc = Desmos.GraphingCalculator(document.getElementById('calc'), { expressionsCollapsed: false });
    async function load() {
      const name = document.getElementById('song').value;
      const res = await fetch(`../build/${name}.json`);
      if (!res.ok) { alert(`build/${name}.json not found — run: python -m desmos_music`); return; }
      calc.setState(await res.json());
      document.getElementById('play').textContent = '▶ Play';
    }
    async function init() {
      const sel = document.getElementById('song');
      const res = await fetch('../build/index.json');
      const songs = res.ok ? await res.json() : [{ name: 'dune_one', title: 'dune_one' }];
      for (const s of songs) sel.add(new Option(s.title, s.name));
      const want = new URLSearchParams(location.search).get('song');
      if (want) sel.value = want;
      sel.onchange = load;
      load();
    }
    function setPlaying(on) {
      const s = calc.getState();
      s.expressions.ticker.playing = on;
      calc.setState(s, { allowUndo: false });
      document.getElementById('play').textContent = on ? '⏸ Pause' : '▶ Play';
    }
    const isPlaying = () => calc.getState().expressions.ticker?.playing;
    document.getElementById('play').onclick = () => setPlaying(!isPlaying());
    document.getElementById('restart').onclick = () => {
      calc.setExpression({ id: '3', latex: 't=0' });
    };
    document.getElementById('load').onclick = load;
    window.calc = calc;
    init();
  </script>
</body>
</html>
