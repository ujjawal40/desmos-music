name: build-check
on: [push, pull_request]
jobs:
  up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m desmos_music
      - name: build/ must match songs/
        run: git diff --exit-code -- build/
